name: Repository health

# Dogfooding: the scheduled scan of our own repository, published as a badge.
# CI already runs the Action on every push as an integration test; this one is about
# the grade rather than about whether the code works.

on:
  push:
    branches: [main] # so the badge reflects a change as soon as it lands
  schedule:
    - cron: '0 9 * * 1' # Mondays at 09:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the badge to the `badges` branch

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Optional. `branch_protection` is the heaviest rule and needs
      # administration:read, which the default GITHUB_TOKEN does not have — without
      # it the rule reports `na` and drops out of the score entirely. An App
      # installation token is short-lived and scoped; see CONTRIBUTING.md#tokens.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: vars.FETTLE_APP_CLIENT_ID != ''
        # If the App has not been granted Administration, minting a token that asks
        # for it fails outright. Degrade to GITHUB_TOKEN instead: the scan still
        # runs, `branch_protection` reports `na`, and the report says how to unlock
        # it — which is the behaviour this tool asks of everyone else.
        continue-on-error: true
        with:
          client-id: ${{ vars.FETTLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FETTLE_APP_PRIVATE_KEY }}
          # Narrower than the App itself: scanning only ever reads, even though the
          # same App needs write access when it is cutting a release.
          permission-administration: read
          permission-contents: read
          permission-pull-requests: read

      - name: Note when the App token was unavailable
        if: steps.app-token.outcome == 'failure'
        run: |
          echo "::warning::Could not mint an App token, so this scan used GITHUB_TOKEN."
          echo "branch_protection will report 'na'. Grant the App repository"
          echo "Administration: Read-only and accept the permission update on the"
          echo "installation. See CONTRIBUTING.md#tokens."

      - name: Grade this repository
        id: health
        uses: ./
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: fettle-report/
          if-no-files-found: error
          retention-days: 90

      # shields.io needs the badge JSON at a URL it can fetch, so it lives on an
      # orphan `badges` branch rather than in the tree — a grade that changes on its
      # own should not churn main's history or trigger its checks.
      #
      # Pushed with GITHUB_TOKEN deliberately: that token starts no workflow runs,
      # which is exactly what we want for a branch containing one JSON file.
      - name: Publish the badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work="$RUNNER_TEMP/badges"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"

          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git fetch -q --depth 1 origin badges 2>/dev/null; then
            git checkout -q FETCH_HEAD && git checkout -q -B badges
          else
            echo "No badges branch yet; creating it."
            git checkout -q --orphan badges
          fi

          rm -f ./*.json ./*.svg
          cp "$GITHUB_WORKSPACE"/fettle-report/badge/* .

          cat > README.md <<'NOTE'
          # badges

          Generated. Holds the shields.io endpoint payloads written by
          `.github/workflows/health.yml`. Nothing here is edited by hand, and no
          source lives on this branch.
          NOTE

          git add -A
          if git diff --staged --quiet; then
            echo "Badge unchanged."
          else
            git commit -q -m "chore: update the health badge"
            git push -q origin badges
            echo "Badge published."
          fi

      - name: Summarise
        run: |
          echo "Graded ${{ steps.health.outputs.grade }} (${{ steps.health.outputs.score }})"
