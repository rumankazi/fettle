name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories surface even when nobody is pushing.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis. Free on public repositories and on GitHub Advanced Security.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-extended` over the default: this is a small codebase, so the
          # extra queries cost little and we would rather see the marginal findings.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # Blocks a pull request that introduces a dependency with a known advisory, or one
  # under a licence we cannot ship. Precise and low-noise, which is why it gates PRs
  # while the audit below does not.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later

  # Audits the whole installed tree, including transitive development dependencies.
  #
  # Deliberately not on pull requests: an advisory published this morning is not the
  # fault of the change under review, and a check that blocks unrelated work gets
  # routed around. Scheduled runs make it visible without making it someone else's
  # problem at the wrong moment.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Accepted advisories live in pnpm.auditConfig.ignoreGhsas, and every one of
      # them is justified in SECURITY.md under "Accepted advisories". Adding an id
      # there without adding the reasoning is not acceptable.
      - name: Audit dependencies shipped to consumers
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies, including build tooling
        run: pnpm audit --audit-level high

  # Our runtime dependency budget is an invariant, not a preference: the Action ships
  # every one of them as executable code to consumers who never run an install.
  dependency-budget:
    name: Runtime dependency budget
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check declared runtime dependencies against the allowlist
        run: |
          allowed='@fettle/core @octokit/core js-yaml'
          status=0
          for manifest in packages/*/package.json; do
            deps=$(node -e "
              const pkg = require('./$manifest');
              console.log(Object.keys(pkg.dependencies ?? {}).join('\n'));
            ")
            for dep in $deps; do
              case " $allowed " in
                *" $dep "*) ;;
                *)
                  echo "::error file=$manifest::'$dep' is not an allowed runtime dependency."
                  echo "  Add a justification comment in $manifest and update this allowlist,"
                  echo "  or implement it in ~30 lines of our own code. See CONTRIBUTING.md."
                  status=1 ;;
              esac
            done
          done
          exit $status
