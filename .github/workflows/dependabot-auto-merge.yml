name: Dependabot auto-merge

# Turns on auto-merge for the low-risk half of Dependabot's output, so the routine
# patch and minor bumps land themselves once the checks pass, and a human only looks
# at the ones that can actually break something.
#
# Auto-merge means "merge when required checks pass", not "merge now". It is only
# meaningful if `main` has branch protection with required checks — without that,
# GitHub has nothing to wait for. See CONTRIBUTING.md#repository-settings.
#
# Deliberately excluded:
#   - major bumps of anything: they are why the runtime dependency budget exists;
#   - any bump to a runtime dependency, major or not, because those ship to
#     consumers inside the Action bundle.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ github.token }}

      # Workflows triggered by Dependabot get a read-only GITHUB_TOKEN that
      # `permissions:` cannot elevate, so enabling auto-merge needs a token of our
      # own. The alternative, `pull_request_target`, runs untrusted branch content
      # with write access, which is not a trade worth making for this.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: vars.FETTLE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.FETTLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FETTLE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Explain why nothing happened
        if: vars.FETTLE_APP_CLIENT_ID == ''
        run: |
          echo "::notice::No FETTLE_APP_CLIENT_ID configured, so auto-merge was not enabled."
          echo "Dependabot's own token is read-only. See CONTRIBUTING.md#tokens."

      - name: Enable auto-merge
        if: >-
          vars.FETTLE_APP_CLIENT_ID != '' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.dependency-type != 'direct:production'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
          echo "Auto-merge enabled; it will merge when the required checks pass."

      - name: Explain why this one needs a human
        if: >-
          vars.FETTLE_APP_CLIENT_ID != '' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-major' ||
           steps.metadata.outputs.dependency-type == 'direct:production')
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          echo "::notice::Left for review — update-type=$UPDATE_TYPE, dependency-type=$DEPENDENCY_TYPE."
          echo "Major bumps, and anything that ships inside the Action bundle, get read by a person."
