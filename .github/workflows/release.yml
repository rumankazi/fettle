name: Release

# Releases are driven by Conventional Commits, not by anyone remembering to tag.
#
# The flow, end to end:
#
#   1. Merge normal pull requests to main. The squashed commit subject is the PR
#      title, which `pr-title.yml` requires to be a Conventional Commit.
#   1a. A GitHub App token is minted, if one is configured. This matters more than
#      it looks: a pull request opened using the default GITHUB_TOKEN does not
#      trigger `pull_request` workflows, so without an App the release pull request
#      arrives with no checks on it at all — including the one that rebuilds the
#      Action bundle. See CONTRIBUTING.md#tokens.
#   2. This workflow opens or updates a release pull request titled
#      "chore: release X.Y.Z". It works out X.Y.Z from the commits since the last
#      release: `feat` bumps the minor, `fix` the patch, `!` or BREAKING CHANGE the
#      major. It writes CHANGELOG.md and bumps all four places the version lives.
#   3. `release-pr.yml` rebuilds the committed Action bundle on that pull request,
#      because the version is baked into it, and re-runs the full check suite.
#   4. Merging the release pull request is the release. This workflow then tags it,
#      creates the GitHub release, publishes to npm, and moves the floating major
#      tag that Action consumers pin to.
#
# So: nothing is released until someone merges the release pull request, and the
# only decision left to a human is when — never what version.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or publish a release
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, release, and push the release pull request branch
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      version: ${{ steps.release.outputs.version }}

    steps:
      # A short-lived installation token, so the release pull request is authored by
      # the App and therefore does trigger the checks that must run on it.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: vars.FETTLE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.FETTLE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FETTLE_APP_PRIVATE_KEY }}

      - name: Warn when running without an App token
        if: vars.FETTLE_APP_CLIENT_ID == ''
        run: |
          echo "::warning::No FETTLE_APP_CLIENT_ID configured, so the release pull request is"
          echo "authored by GITHUB_TOKEN and will not trigger any checks — including the"
          echo "bundle rebuild in release-pr.yml. Push an empty commit to that branch to"
          echo "wake them up, or configure the App. See CONTRIBUTING.md#tokens."

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag }}
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # move the floating major tag
      id-token: write # npm provenance

    # Lifted to the job so the publish step can test for it: the `secrets` context
    # is not available in a step-level `if`.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Everything CI checks, once more, against the exact tree being published.
      # A tag cannot be amended after the fact.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Verify the committed Action bundle matches source
        run: |
          if ! git diff --exit-code -- packages/action/dist; then
            echo "::error::packages/action/dist is stale at ${{ needs.release-please.outputs.tag }}."
            echo "The release pull request should have rebuilt it — see .github/workflows/release-pr.yml."
            exit 1
          fi

      # Compare against release-please's own version output rather than parsing the
      # tag. Tag formats are configuration and have already changed once; the
      # version is the thing this actually needs to agree on.
      - name: Verify the release version matches the packages
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$version" != "$RELEASE_VERSION" ]; then
            echo "::error::release $RELEASE_VERSION does not match package version $version."
            exit 1
          fi
          echo "Publishing version $version."

      # Action consumers pin `@v1` and expect it to follow the latest v1.x. This is
      # the only thing that moves it.
      #
      # Deliberately before publishing: the Action and the npm packages are
      # independent artefacts, and everything above has already verified this tree.
      # An npm outage, a rotated token or a misconfigured trusted publisher should
      # not strand Action consumers on an old bundle.
      - name: Move the floating major tag
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f "$MAJOR" "$TAG"
          git push --force origin "refs/tags/$MAJOR"
          echo "$MAJOR now points at $TAG"

      # pnpm packs — it is the only thing that knows how to rewrite `workspace:*`
      # into a real version — and npm publishes, because npm is what performs the
      # OIDC exchange for trusted publishing. Verified: the packed manifest carries
      # `"@fettle/core": "<version>"`, not the workspace protocol.
      - name: Pack the publishable packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          (cd packages/core && pnpm pack --pack-destination "$RUNNER_TEMP/packages")
          (cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP/packages")
          ls -l "$RUNNER_TEMP/packages"

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0. Everything above
      # this point deliberately ran on Node 20, the version the packages support.
      - uses: actions/setup-node@v4
        if: vars.NPM_TRUSTED_PUBLISHING == 'true' || env.NPM_TOKEN != ''
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # No token anywhere: npm exchanges the workflow's OIDC identity for a
      # short-lived, single-use credential. Provenance is generated automatically,
      # so `--provenance` is neither needed nor passed.
      - name: Publish to npm via trusted publishing
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          npm --version
          npm publish "$RUNNER_TEMP/packages/fettle-core-$VERSION.tgz" --access public
          npm publish "$RUNNER_TEMP/packages/fettle-cli-$VERSION.tgz" --access public

      - name: Publish to npm with a token
        if: vars.NPM_TRUSTED_PUBLISHING != 'true' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          npm publish "$RUNNER_TEMP/packages/fettle-core-$VERSION.tgz" --access public --provenance
          npm publish "$RUNNER_TEMP/packages/fettle-cli-$VERSION.tgz" --access public --provenance

      - name: Report that publishing was skipped
        if: vars.NPM_TRUSTED_PUBLISHING != 'true' && env.NPM_TOKEN == ''
        run: |
          echo "::warning::Neither NPM_TRUSTED_PUBLISHING nor NPM_TOKEN is set, so"
          echo "nothing was published to npm. The tag, the GitHub release and the"
          echo "floating major tag are all in place. See CONTRIBUTING.md#tokens."
