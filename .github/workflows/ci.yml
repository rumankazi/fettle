name: CI

on:
  # Only `main` on push. Any other branch that matters has a pull request, and
  # running on both meant every push to a branch ran CI twice — once for the push
  # and once for the pull request — at double the minutes for the same commit.
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to what they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Every version we claim to run on, and the one we will claim next.
    #
    #   22 — the floor. `engines` says >=22, and pnpm itself needs >=22.13.
    #   24 — the current active LTS, what `runs.using` provides, and what the
    #        release job publishes from.
    #   26 — the newest release. Nothing pins us to it, but it is what people
    #        upgrade to next, and a break found here costs a rebase not a hotfix.
    #
    # fail-fast is off so one version's failure does not hide another's.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Third-party actions are pinned to a commit SHA; Dependabot moves them.
      # actions/* are first-party and tracked by major tag.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check (including tests)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Consumers run the committed bundle, never an install, so a stale dist ships
      # code nobody reviewed. Rebuilding above and diffing here is the guard.
      #
      # Skipped on bot branches: a version bump bakes into the bundle and an esbuild
      # upgrade changes its output, so both necessarily make it stale.
      # release-pr.yml rebuilds it there and re-runs these checks afterwards.
      - name: Verify the committed Action bundle is up to date
        if: >-
          ${{ !startsWith(github.head_ref, 'release-please--') &&
              !startsWith(github.head_ref, 'renovate/') }}
        run: |
          if ! git diff --exit-code -- packages/action/dist; then
            echo "::error::packages/action/dist is out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi

      # The unit tests import the Action's source, so they cannot catch a bundle
      # that fails to load — bundling CommonJS dependencies into ESM output has
      # done exactly that. Run the real artefact and check it reaches our own
      # input validation.
      #
      # Feed it a repository name it must reject. Emptying GITHUB_REPOSITORY does
      # not work — the runner sets it for the job and an empty step-level override
      # does not take, so the Action found this repository and cheerfully scanned it.
      - name: Verify the committed Action bundle loads
        env:
          INPUT_REPOS: 'not-a-repository-name'
        run: |
          output=$(node packages/action/dist/index.js 2>&1 || true)
          echo "$output"
          case "$output" in
            *"is not a repository name of the form org/name"*)
              echo "Action bundle loads and runs." ;;
            *)
              echo "::error::The Action bundle did not load, or did not validate its input."
              echo "::error::Check packages/action/build.mjs."
              exit 1 ;;
          esac

  # An end-to-end run against a real repository — ours. Unit tests all mock the
  # transport, so this is the only check that exercises the actual GitHub API, the
  # committed bundle and the runner protocol together.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Scan this repository with this build
        id: health
        uses: ./
        # No fail-below: a health grade must never gate a code change. The point is
        # that the Action ran and produced a report.

      - name: Check the run produced what it promises
        env:
          REPORT: ${{ steps.health.outputs.report-path }}
          GRADE: ${{ steps.health.outputs.grade }}
        run: |
          test -f "$REPORT" || { echo "::error::no report at $REPORT"; exit 1; }
          test -n "$GRADE"  || { echo "::error::no grade output"; exit 1; }
          node -e '
            const report = require("node:fs").readFileSync(process.env.REPORT, "utf8");
            const parsed = JSON.parse(report);
            if (parsed.schemaVersion !== 1) throw new Error("unexpected schemaVersion");
            if (parsed.repos.length !== 1) throw new Error("expected one repository");
            const rules = parsed.repos[0].rules;
            if (rules.length !== 5) throw new Error("expected five rules, got " + rules.length);
            for (const rule of rules) {
              if (!rule.evidence) throw new Error("rule " + rule.id + " has no evidence");
            }
            console.log("report ok:", parsed.repos[0].grade, parsed.repos[0].score);
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-scan-report
          path: ${{ steps.health.outputs.report-path }}
          if-no-files-found: error
